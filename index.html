<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TermoDom – bezpłatna wycena</title>
  <style>
    :root {
      --bg: #f5f7f6; --card: #fff; --ink: #1d2b24; --muted: #5b6b63;
      --line: #d9e1dc; --brand: #1f7a4d; --brand-ink: #fff; --err: #b3261e;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
    header { background: var(--brand); color: var(--brand-ink); padding: 32px 16px; text-align: center; }
    header h1 { margin: 0 0 4px; font-size: 28px; }
    header p { margin: 0; opacity: .9; }
    .demo { background: #fff4d6; color: #6b5200; text-align: center; font-size: 14px; padding: 8px 16px; }
    main { max-width: 640px; margin: 24px auto; padding: 0 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 4px; }
    .field { margin-bottom: 16px; }
    input[type=text], input[type=tel], input[type=email], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; background: #fff;
    }
    textarea { min-height: 110px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 1px; border-color: var(--brand); }
    fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 12px; margin: 0 0 16px; }
    legend { font-weight: 600; font-size: 14px; padding: 0 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips label { font-weight: 400; display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; margin: 0; }
    .chips input:checked + span { font-weight: 600; color: var(--brand); }
    .consent { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; font-weight: 400; }
    .consent input { margin-top: 4px; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    button { width: 100%; padding: 12px; border: 0; border-radius: 8px; background: var(--brand); color: var(--brand-ink); font: inherit; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    .msg { margin-top: 16px; padding: 12px; border-radius: 8px; display: none; }
    .msg.err { display: block; background: #fdecea; color: var(--err); }
    .ok { text-align: center; padding: 32px 8px; }
    .ok h2 { color: var(--brand); }
    .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div class="demo">Strona demonstracyjna. Nie wpisuj prawdziwych danych.</div>
  <header>
    <h1>TermoDom</h1>
    <p>Pompy ciepła, ocieplenie, okna, fotowoltaika. Bezpłatna wycena w 24 h.</p>
  </header>

  <main>
    <div class="card" id="card">
      <form id="lead-form" novalidate>
        <h2>Zostaw kontakt, oddzwonimy</h2>

        <div class="row">
          <div class="field">
            <label for="imie">Imię</label>
            <input id="imie" name="imie" type="text" maxlength="100" autocomplete="given-name" required>
          </div>
          <div class="field">
            <label for="miasto">Miasto</label>
            <input id="miasto" name="miasto" type="text" maxlength="100" autocomplete="address-level2">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="telefon">Telefon</label>
            <input id="telefon" name="telefon" type="tel" maxlength="20" autocomplete="tel">
          </div>
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" maxlength="150" autocomplete="email">
          </div>
        </div>
        <p class="hint" style="margin-top:-8px;margin-bottom:16px">Podaj telefon lub e-mail.</p>

        <fieldset>
          <legend>Czego dotyczy zapytanie?</legend>
          <div class="chips">
            <label><input type="checkbox" name="produkt" value="pompa ciepła"><span>Pompa ciepła</span></label>
            <label><input type="checkbox" name="produkt" value="ocieplenie"><span>Ocieplenie</span></label>
            <label><input type="checkbox" name="produkt" value="okna"><span>Okna</span></label>
            <label><input type="checkbox" name="produkt" value="fotowoltaika"><span>Fotowoltaika</span></label>
            <label><input type="checkbox" name="produkt" value="inne"><span>Inne</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="opis">Opis (metraż, rok budowy, obecne ogrzewanie)</label>
          <textarea id="opis" name="opis" maxlength="2000"></textarea>
        </div>

        <!-- Honeypot: ludzie go nie widzą, boty wypełniają -->
        <div class="hp" aria-hidden="true">
          <label for="website">Strona www</label>
          <input id="website" name="website" type="text" tabindex="-1" autocomplete="off">
        </div>

        <div class="field">
          <label class="consent">
            <input id="zgoda" name="zgoda" type="checkbox" required>
            <span>Zgadzam się na przetwarzanie moich danych w celu przygotowania wyceny i kontaktu (RODO).</span>
          </label>
        </div>

        <button type="submit" id="send">Wyślij zapytanie</button>
        <div class="msg" id="msg" role="alert"></div>
      </form>
    </div>
  </main>

  <script src="../config.js"></script>
  <script>
    const form = document.getElementById('lead-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('send');

    const showError = text => { msg.textContent = text; msg.className = 'msg err'; };

    form.addEventListener('submit', async e => {
      e.preventDefault();
      msg.className = 'msg';

      const v = id => document.getElementById(id).value.trim();
      const data = {
        imie: v('imie'),
        telefon: v('telefon'),
        email: v('email'),
        miasto: v('miasto'),
        produkt: [...form.querySelectorAll('input[name=produkt]:checked')].map(c => c.value),
        opis: v('opis'),
        zgoda: document.getElementById('zgoda').checked, // boolean, tego oczekuje n8n
        website: v('website')
      };

      if (!data.imie) return showError('Podaj imię.');
      if (data.telefon.replace(/[^\d]/g, '').length < 9 && !data.email.includes('@'))
        return showError('Podaj poprawny telefon lub e-mail.');
      if (!data.zgoda) return showError('Zaznacz zgodę na przetwarzanie danych.');

      btn.disabled = true;
      btn.textContent = 'Wysyłanie…';
      try {
        const res = await fetch(window.API_URL + '/lead', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' },
          body: JSON.stringify(data)
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        document.getElementById('card').innerHTML =
          '<div class="ok"><h2>Dziękujemy!</h2><p>Oddzwonimy w ciągu 24 godzin w dni robocze.</p></div>';
      } catch (err) {
        showError('Nie udało się wysłać. Spróbuj ponownie za chwilę albo zadzwoń: 12 000 00 00.');
        btn.disabled = false;
        btn.textContent = 'Wyślij zapytanie';
      }
    });
  </script>
</body>
</html>
